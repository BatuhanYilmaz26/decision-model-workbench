x-decision-environment: &decision-env
  DMT_DECISION_PROFILES_FILE: ${DMT_DECISION_PROFILES_FILE:-}
  DMT_TAXONOMY_PROFILES_FILE: ${DMT_TAXONOMY_PROFILES_FILE:-}
  DMT_TAXONOMY_TYPESAFE_API_KEY: ${DMT_TAXONOMY_TYPESAFE_API_KEY:-}
  DMT_PROVIDER_TYPESAFE_API_KEY: ${DMT_PROVIDER_TYPESAFE_API_KEY:-}
  DMT_PROVIDER_OPENROUTER_API_KEY: ${DMT_PROVIDER_OPENROUTER_API_KEY:-}
  DMT_PROVIDER_PERPLEXITY_API_KEY: ${DMT_PROVIDER_PERPLEXITY_API_KEY:-}
  DMT_PROVIDER_CLOUDFLARE_API_KEY: ${DMT_PROVIDER_CLOUDFLARE_API_KEY:-}
x-cloud-environment: &cloud-env
  DMT_CLOUD_MODAL_TOKEN_ID: ${DMT_CLOUD_MODAL_TOKEN_ID:-}
  DMT_CLOUD_MODAL_TOKEN_SECRET: ${DMT_CLOUD_MODAL_TOKEN_SECRET:-}
  DMT_CLOUD_PROFILES_FILE: ${DMT_CLOUD_PROFILES_FILE:-}
  DMT_CLOUD_RUNPOD_API_KEY: ${DMT_CLOUD_RUNPOD_API_KEY:-}
  DMT_CLOUD_RUNPOD_S3_ACCESS_KEY_ID: ${DMT_CLOUD_RUNPOD_S3_ACCESS_KEY_ID:-}
  DMT_CLOUD_RUNPOD_S3_SECRET_ACCESS_KEY: ${DMT_CLOUD_RUNPOD_S3_SECRET_ACCESS_KEY:-}
  DMT_CLOUD_AZURE_CLIENT_SECRET: ${DMT_CLOUD_AZURE_CLIENT_SECRET:-}
  DMT_CLOUD_GCP_CREDENTIALS_FILE: ${DMT_CLOUD_GCP_CREDENTIALS_FILE:-}
  DMT_CLOUD_AWS_ACCESS_KEY_ID: ${DMT_CLOUD_AWS_ACCESS_KEY_ID:-}
  DMT_CLOUD_AWS_SECRET_ACCESS_KEY: ${DMT_CLOUD_AWS_SECRET_ACCESS_KEY:-}
  DMT_CLOUD_AWS_SESSION_TOKEN: ${DMT_CLOUD_AWS_SESSION_TOKEN:-}
x-teacher-environment: &teacher-env
  DMT_TEACHER_BASE_URL: ${DMT_TEACHER_BASE_URL:-}
  DMT_TEACHER_MODEL: ${DMT_TEACHER_MODEL:-}
  DMT_SCHEMA_TIMEOUT_SECONDS: ${DMT_SCHEMA_TIMEOUT_SECONDS:-60}
  DMT_SCHEMA_CALLS_PER_DAY: ${DMT_SCHEMA_CALLS_PER_DAY:-20}
x-common: &common
  build: .
  image: domain-decision-platform:local
  restart: unless-stopped
  volumes:
    - workspace:/app/data
    - ./data/config:/run/config:ro
  environment: &env
    DMT_HOME: /app/data/workspace
    DMT_KEYS_FILE: /run/config/operator-keys.json
services:
  api:
    <<: *common
    environment:
      <<: [*env, *decision-env, *cloud-env, *teacher-env]
      DMT_SEMANTIC_PROFILE_FILE: ${DMT_SEMANTIC_PROFILE_FILE:-}
      DMT_BACKUP_MONITOR_PROFILE: ${DMT_BACKUP_MONITOR_PROFILE:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
  worker:
    <<: *common
    command: ["domain-worker"]
    environment:
      <<: [*env, *decision-env, *cloud-env, *teacher-env]
      DMT_TEACHER_API_KEY: ${DMT_TEACHER_API_KEY:-}
      DMT_SEMANTIC_PROFILE_FILE: ${DMT_SEMANTIC_PROFILE_FILE:-}
      DMT_SEMANTIC_PYTHON: ${DMT_SEMANTIC_PYTHON:-}
  web:
    <<: *common
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.headless", "true"]
    environment:
      <<: *env
      DMT_API_URL: http://api:8080
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
volumes:
  workspace:
